services:
  # 1. WireGuard-Easy: Web UI + Fast WireGuard VPN
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    environment:
      # Public IP or DDNS hostname your clients will connect to
      - WG_HOST=${WG_HOST:-myhome.example.com}
      # Admin Web UI password (bcrypt hash or plain text on first launch)
      - PASSWORD=${WG_PASSWORD:-ChangeMeSecurely123!}
      # Port configuration
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1, 1.0.0.1
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
    volumes:
      - ./data/wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1

  # 2. Tailscale: Zero-Config Mesh VPN & Subnet Router
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale-subnet-router
    hostname: homelab-gateway
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-your_tailscale_auth_key_here}
      - TS_ROUTES=${TS_LAN_SUBNET:-192.168.1.0/24}
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # 3. Sentinel Remote Access Watchdog: Instant Telegram alerts on disconnect or WAN change
  vpn-sentinel:
    image: python:3.12-alpine
    container_name: vpn-sentinel
    restart: unless-stopped
    volumes:
      - ./watchdog:/app
    working_dir: /app
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CHECK_INTERVAL_SECONDS=60
    command: python monitor.py
